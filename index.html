
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bootstrap Form Example</title>

    <link rel="stylesheet"
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css">

    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/popper.js/1.16.0/umd/popper.min.js"></script>
    <script src="https://maxcdn.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>

    <link rel="stylesheet" href="style.css">
    <script src="code.js" defer></script>
</head>

<body>
    <div class="container">
        <h1>Email Confirmation</h1>

        <div class="form-group">
            <label for="email">
                Email Address: <span id="email-error"></span>
            </label>
            <input type="email" class="form-control"
                   placeholder="Enter email" id="email">
        </div>

        <div class="form-group">
            <label for="confirm">
                Confirm Email: <span id="confirm-error"></span>
            </label>
            <input type="email" class="form-control"
                   placeholder="Confirm email" id="confirm">
        </div>

        <input type="button" class="btn btn-primary"
               value="Confirm Email" onclick="checkEmail()">

        <hr>

        <h1>Pizza Hut Order Form</h1>
        <hr>

        <div class="form-check">
            <label class="form-check-label" for="small">
                <input type="radio" class="form-check-input"
                       id="small" name="sizing" value="Small" checked>
                Small
            </label>
        </div>

        <div class="form-check">
            <label class="form-check-label" for="medium">
                <input type="radio" class="form-check-input"
                       id="medium" name="sizing" value="Medium">
                Medium
            </label>
        </div>

        <div class="form-check">
            <label class="form-check-label" for="large">
                <input type="radio" class="form-check-input"
                       id="large" name="sizing" value="Large">
                Large
            </label>
        </div>

        <hr>

        <h4>Toppings</h4>

        <div class="form-check">
            <label class="form-check-label" for="pepperoni">
                <input type="checkbox" class="form-check-input"
                       id="pepperoni" value="Pepperoni">
                Pepperoni
            </label>
        </div>

        <div class="form-check">
            <label class="form-check-label" for="sausage">
                <input type="checkbox" class="form-check-input"
                       id="sausage" value="Sausage">
                Sausage
            </label>
        </div>

        <div class="form-check">
            <label class="form-check-label" for="mushrooms">
                <input type="checkbox" class="form-check-input"
                       id="mushrooms" value="Mushrooms">
                Mushrooms
            </label>
        </div>

        <hr>

        <input type="button" class="btn btn-success"
               value="Process Order" onclick="pizzaOrder()">

        <div id="output" class="mt-3"></div>

        <div id="pizza">
            <img id="cheese" src="images/cheese.png"
                 alt="Cheese pizza">
            <img id="pepperoni-topping" src="images/pepperoni.png"
                 alt="Pepperoni topping">
            <img id="sausage-topping" src="images/sausage.png"
                 alt="Sausage topping">
            <img id="mushrooms-topping" src="images/mushrooms.png"
                 alt="Mushroom topping">
        </div>
    </div>
</body>
</html>
